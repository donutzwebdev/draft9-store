<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --accent:#0078d4;--accent2:#1a8fe3;
  --glass:rgba(255,255,255,0.07);--glass2:rgba(255,255,255,0.12);
  --border:rgba(255,255,255,0.12);--border2:rgba(255,255,255,0.22);
  --text:#f3f3f3;--text2:rgba(243,243,243,0.65);--text3:rgba(243,243,243,0.35);
  --bg:#0d0d1a;--font:'Inter',system-ui,sans-serif;--radius:8px;
  --shadow:0 8px 32px rgba(0,0,0,0.45);
  --danger:#ff6b6b;--dangerbg:rgba(255,80,80,0.15);--dangerborder:rgba(255,80,80,0.3);
}
body{font-family:var(--font);background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;}
#loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:200;}
.spinner{width:30px;height:30px;border:2px solid rgba(255,255,255,.1);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.load-text{font-size:.78rem;color:var(--text2);}
#setup{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:100;}
.setup-card{background:rgba(25,25,45,.95);border:1px solid var(--border2);border-radius:16px;padding:34px 38px;width:340px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);}
.setup-title{font-size:1.35rem;font-weight:700;text-align:center;}
.setup-tabs{display:flex;background:rgba(0,0,0,.3);border-radius:8px;overflow:hidden;border:1px solid var(--border);}
.setup-tab{flex:1;padding:8px;text-align:center;font-size:.76rem;font-weight:600;cursor:pointer;background:none;border:none;color:var(--text2);font-family:var(--font);}
.setup-tab.active{background:var(--accent);color:#fff;}
.inp{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:var(--radius);padding:9px 13px;color:var(--text);font-family:var(--font);font-size:.86rem;outline:none;width:100%;}
.inp:focus{border-color:var(--accent);}
.setup-btn{background:var(--accent);border:none;border-radius:var(--radius);padding:10px;color:#fff;font-weight:600;font-size:.86rem;cursor:pointer;font-family:var(--font);}
.setup-btn:hover{background:var(--accent2);}
.err{font-size:.73rem;color:var(--danger);display:none;text-align:center;padding:4px 0;}
.err.show{display:block;}
#app{display:none;flex:1;overflow:hidden;}
/* SIDEBAR */
.sidebar{width:224px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;background:rgba(0,0,0,.22);}
.sidebar-top{padding:9px;border-bottom:1px solid var(--border);flex-shrink:0;}
.sidebar-user{display:flex;align-items:center;gap:7px;margin-bottom:7px;}
.user-pfp{width:30px;height:30px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:.76rem;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden;cursor:pointer;}
.user-pfp img,.chat-avatar img,.ch-avatar img,.msg-pfp img{width:100%;height:100%;object-fit:cover;border-radius:inherit;}
.user-name{font-size:.78rem;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.logout-btn{background:rgba(255,80,80,.12);border:1px solid rgba(255,80,80,.25);border-radius:6px;color:#ff6b6b;cursor:pointer;font-size:.68rem;padding:4px 8px;font-family:var(--font);font-weight:600;transition:all .15s;white-space:nowrap;}
.logout-btn:hover{background:rgba(255,80,80,.25);}
.sb-actions{display:flex;gap:4px;flex-wrap:wrap;}
.sb-btn{flex:1;min-width:0;background:var(--glass);border:1px solid var(--border);border-radius:6px;padding:5px 6px;color:var(--text2);font-size:.64rem;font-family:var(--font);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sb-btn:hover{background:var(--glass2);color:var(--text);}
.sb-btn.accent{background:var(--accent);border-color:transparent;color:#fff;}
.sb-btn.accent:hover{background:var(--accent2);}
.sec-label{font-size:.58rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:8px 11px 3px;}
.chat-list{overflow-y:auto;}
.chat-item{display:flex;align-items:center;gap:7px;padding:6px 9px;cursor:pointer;border-radius:7px;margin:0 3px 1px;transition:background .13s;}
.chat-item:hover{background:var(--glass);}
.chat-item.active{background:var(--glass2);}
.chat-avatar{width:26px;height:26px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden;}
.chat-avatar.server{border-radius:7px;font-size:.9rem;}
.chat-info{flex:1;min-width:0;}
.chat-name{font-size:.74rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chat-preview{font-size:.61rem;color:var(--text3);}
/* MAIN */
.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.chat-header{height:42px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 13px;gap:9px;flex-shrink:0;background:rgba(0,0,0,.14);}
.ch-avatar{width:26px;height:26px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden;}
.ch-avatar.server{border-radius:6px;font-size:.9rem;}
.ch-name{font-size:.84rem;font-weight:700;flex:1;}
.header-btn{background:var(--glass);border:1px solid var(--border);border-radius:6px;padding:3px 9px;color:var(--text2);font-size:.64rem;font-family:var(--font);cursor:pointer;margin-left:2px;}
.header-btn:hover{background:var(--glass2);color:var(--text);}
.code-chip{font-size:.63rem;color:var(--text3);background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:4px;padding:2px 7px;cursor:pointer;font-family:monospace;}
.code-chip:hover{background:var(--glass2);color:var(--text);}
.messages-area{flex:1;overflow-y:auto;padding:9px 13px;display:flex;flex-direction:column;gap:1px;}
.no-chat{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--text3);font-size:.78rem;text-align:center;}
.empty-msgs{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:var(--text3);font-size:.76rem;padding:20px;flex:1;}
.day-div{text-align:center;font-size:.6rem;color:var(--text3);padding:7px 0;position:relative;}
.day-div::before{content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:var(--border);}
.day-div span{background:var(--bg);padding:0 8px;position:relative;}
.msg-group{display:flex;flex-direction:column;margin-top:5px;}
.msg-group.self{align-items:flex-end;}
.msg-meta{display:flex;align-items:center;gap:5px;margin-bottom:2px;padding:0 3px;}
.msg-group.self .msg-meta{flex-direction:row-reverse;}
.msg-pfp{width:18px;height:18px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:.48rem;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden;}
.msg-sender{font-size:.61rem;font-weight:700;color:var(--accent);}
.msg-group.self .msg-sender{color:var(--accent2);}
.msg-ts-sm{font-size:.56rem;color:var(--text3);}
.bubble{max-width:68%;background:var(--glass2);border-radius:13px 13px 13px 4px;padding:7px 11px;font-size:.79rem;line-height:1.5;word-break:break-word;border:1px solid var(--border);}
.msg-group.self .bubble{background:var(--accent);border-color:transparent;border-radius:13px 13px 4px 13px;color:#fff;}
.bubble img{max-width:100%;max-height:200px;border-radius:8px;display:block;margin-top:4px;cursor:pointer;}
.bubble .file-attach{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.2);border-radius:7px;padding:7px 10px;margin-top:4px;text-decoration:none;color:inherit;}
.bubble .file-attach:hover{background:rgba(0,0,0,.35);}
.bubble .file-icon{font-size:1.2rem;}
.bubble .file-info{flex:1;min-width:0;}
.bubble .file-name{font-size:.74rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bubble .file-size{font-size:.62rem;color:var(--text3);}
.msg-group.self .bubble .file-size{color:rgba(255,255,255,.6);}
.msg-ts{font-size:.57rem;color:var(--text3);padding:1px 3px;margin-top:1px;}
.input-row{display:flex;align-items:center;gap:6px;padding:8px 13px;border-top:1px solid var(--border);flex-shrink:0;}
.attach-btn{width:30px;height:30px;border-radius:50%;background:var(--glass);border:1px solid var(--border);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0;}
.attach-btn:hover{background:var(--glass2);}
.msg-input{flex:1;background:var(--glass);border:1px solid var(--border);border-radius:18px;padding:7px 13px;color:var(--text);font-family:var(--font);font-size:.79rem;outline:none;}
.msg-input:focus{border-color:var(--accent);}
.send-btn{width:32px;height:32px;border-radius:50%;background:var(--accent);border:none;color:#fff;cursor:pointer;font-size:.85rem;flex-shrink:0;}
.send-btn:hover{background:var(--accent2);}
/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:80;}
.modal{background:rgba(18,18,36,.98);border:1px solid var(--border2);border-radius:13px;padding:24px;width:min(300px,90vw);display:flex;flex-direction:column;gap:11px;box-shadow:var(--shadow);max-height:80vh;overflow-y:auto;}
.modal-title{font-size:.92rem;font-weight:700;}
.modal-sub{font-size:.72rem;color:var(--text2);margin-top:-5px;line-height:1.5;}
.modal-row{display:flex;gap:7px;}
.mbtn{flex:1;background:var(--accent);border:none;border-radius:var(--radius);padding:8px;color:#fff;font-weight:600;font-size:.78rem;cursor:pointer;font-family:var(--font);}
.mbtn:hover{background:var(--accent2);}
.mbtn.ghost{background:var(--glass);border:1px solid var(--border);color:var(--text2);}
.mbtn.ghost:hover{background:var(--glass2);color:var(--text);}
.mbtn.danger{background:var(--dangerbg);border:1px solid var(--dangerborder);color:var(--danger);}
.mbtn.danger:hover{background:rgba(255,80,80,.25);}
.member-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);}
.member-item:last-child{border-bottom:none;}
.member-av{width:26px;height:26px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:.66rem;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden;}
.member-name{flex:1;font-size:.76rem;font-weight:500;}
.member-role{font-size:.6rem;color:var(--accent);background:rgba(0,120,212,.12);border-radius:4px;padding:1px 5px;}
.member-actions{display:flex;gap:4px;}
.mini-btn{background:var(--glass);border:1px solid var(--border);border-radius:5px;padding:3px 7px;color:var(--text2);font-size:.62rem;font-family:var(--font);cursor:pointer;}
.mini-btn:hover{background:var(--glass2);}
.mini-btn.danger{background:var(--dangerbg);border-color:var(--dangerborder);color:var(--danger);}
/* NOTIFICATIONS */
#notif-stack{position:fixed;top:12px;right:12px;display:flex;flex-direction:column;gap:7px;z-index:500;pointer-events:none;max-width:260px;}
.notif-item{background:rgba(18,18,36,.96);border:1px solid var(--border2);border-radius:10px;padding:10px 13px;box-shadow:var(--shadow);pointer-events:all;animation:notifIn .22s ease;display:flex;gap:9px;align-items:flex-start;}
@keyframes notifIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
.notif-icon{font-size:1rem;flex-shrink:0;margin-top:1px;}
.notif-body{flex:1;min-width:0;}
.notif-title{font-size:.73rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.notif-text{font-size:.68rem;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.notif-close{background:none;border:none;color:var(--text3);cursor:pointer;font-size:.75rem;padding:0 0 0 4px;flex-shrink:0;}
.notif-close:hover{color:var(--text);}
/* IMAGE LIGHTBOX */
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:300;cursor:zoom-out;}
#lightbox img{max-width:90vw;max-height:90vh;border-radius:8px;box-shadow:var(--shadow);}
/* TOAST */
#toast{position:fixed;bottom:12px;right:12px;background:rgba(18,18,36,.96);border:1px solid var(--border2);border-radius:9px;padding:8px 13px;font-size:.74rem;box-shadow:var(--shadow);transform:translateY(8px);opacity:0;transition:all .2s;pointer-events:none;max-width:220px;z-index:400;}
#toast.show{transform:none;opacity:1;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:2px;}
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div><div class="load-text">Loading Messages…</div></div>

<div id="setup">
  <div class="setup-card">
    <div class="setup-title">💬 Messages</div>
    <div class="setup-tabs">
      <button class="setup-tab active" id="tab-in">Sign In</button>
      <button class="setup-tab" id="tab-up">Sign Up</button>
    </div>
    <div id="form-in" style="display:flex;flex-direction:column;gap:9px;">
      <input class="inp" id="in-user" placeholder="Username" maxlength="32">
      <input class="inp" id="in-pass" type="password" placeholder="Password">
      <div class="err" id="in-err"></div>
      <button class="setup-btn" id="in-btn">Sign In</button>
    </div>
    <div id="form-up" style="display:none;flex-direction:column;gap:9px;">
      <input class="inp" id="up-user" placeholder="Choose a username" maxlength="32">
      <input class="inp" id="up-pass" type="password" placeholder="Choose a password (6+ chars)">
      <div class="err" id="up-err"></div>
      <button class="setup-btn" id="up-btn">Create Account</button>
    </div>
  </div>
</div>

<div id="app">
  <div class="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-user">
        <div class="user-pfp" id="my-pfp" title="Change profile picture">?</div>
        <div class="user-name" id="my-name">…</div>
        <button class="logout-btn" id="logout-btn" title="Sign out">Sign Out</button>
      </div>
      <div class="sb-actions">
        <button class="sb-btn" id="btn-join">🔑 Join</button>
        <button class="sb-btn accent" id="btn-create">＋ Server</button>
        <button class="sb-btn" id="btn-dm">💬 DM</button>
      </div>
      <input type="file" id="pfp-file" accept="image/*" style="display:none;">
      <input type="file" id="attach-file" style="display:none;">
    </div>
    <div class="sec-label">Servers</div>
    <div class="chat-list" id="servers-list" style="max-height:44%;overflow-y:auto;"></div>
    <div class="sec-label">Direct Messages</div>
    <div class="chat-list" id="dms-list" style="flex:1;overflow-y:auto;"></div>
  </div>
  <div class="main" id="main-area">
    <div class="no-chat"><div style="font-size:2rem;">💬</div>Pick a server or DM to start</div>
  </div>
</div>

<div id="notif-stack"></div>
<div id="lightbox"><img id="lb-img" src="" alt=""></div>
<div id="toast"></div>

<script>
// ── LOAD FIREBASE ─────────────────────
var fbLoaded=0;
['firebase-app-compat','firebase-auth-compat','firebase-firestore-compat'].forEach(function(n){
  var s=document.createElement('script');
  s.src='https://www.gstatic.com/firebasejs/9.23.0/'+n+'.js';
  s.onload=function(){ if(++fbLoaded===3) boot(); };
  document.head.appendChild(s);
});

var auth,db,me=null,myPfpUrl=null,servers=[],dms=[],blockedIds=[],activeChat=null,unsub=null,notifUnsub=null;
var BANNED_EXT=['.exe','.bat','.cmd','.sh','.msi','.dmg','.ps1','.vbs','.js','.jar','.app','.scr','.pif','.com','.hta','.wsf'];

function boot(){
  firebase.initializeApp({
    apiKey:"AIzaSyB4VZR4PTk27NTb0Ox7UEBiSsxP6zCVinw",
    authDomain:"draft9-fe68d.firebaseapp.com",
    projectId:"draft9-fe68d",
    storageBucket:"draft9-fe68d.firebasestorage.app",
    messagingSenderId:"905853292900",
    appId:"1:905853292900:web:a48fccec2379ccb6642a71"
  });
  auth=firebase.auth(); db=firebase.firestore();
  var saved=localStorage.getItem('d9msg_session');
  if(saved){ try{ me=JSON.parse(saved); myPfpUrl=me.pfp||null; hide('loading'); showApp(); return; }catch(e){} }
  hide('loading'); show('setup');
  wire('tab-in',function(){ switchTab('in'); });
  wire('tab-up',function(){ switchTab('up'); });
  wire('in-btn',doSignIn); wire('up-btn',doSignUp);
  on('in-pass','keydown',function(e){ if(e.key==='Enter') doSignIn(); });
  on('up-pass','keydown',function(e){ if(e.key==='Enter') doSignUp(); });
}

// ── AUTH ──────────────────────────────
function switchTab(t){
  byId('tab-in').classList.toggle('active',t==='in');
  byId('tab-up').classList.toggle('active',t==='up');
  byId('form-in').style.display=t==='in'?'flex':'none';
  byId('form-up').style.display=t==='up'?'flex':'none';
}
function doSignIn(){
  var user=val('in-user'),pass=val('in-pass'),err=byId('in-err');
  err.classList.remove('show'); if(!user||!pass){showErr(err,'Fill in all fields.');return;}
  db.collection('accounts').where('username','==',user).where('password','==',hp(pass)).get().then(function(snap){
    if(snap.empty){showErr(err,'Wrong username or password.');return;}
    var d=snap.docs[0].data();
    me={uid:d.uid,name:d.username,pfp:d.pfp||null};
    myPfpUrl=me.pfp; localStorage.setItem('d9msg_session',JSON.stringify(me));
    hide('setup'); showApp();
  }).catch(function(e){showErr(err,e.message);});
}
function doSignUp(){
  var user=val('up-user'),pass=val('up-pass'),err=byId('up-err');
  err.classList.remove('show');
  if(!user||!pass){showErr(err,'Fill in all fields.');return;}
  if(user.length<2){showErr(err,'Username too short.');return;}
  if(pass.length<6){showErr(err,'Password must be 6+ characters.');return;}
  db.collection('accounts').where('username','==',user).get().then(function(snap){
    if(!snap.empty){showErr(err,'Username already taken.');return;}
    var uid='u_'+Math.random().toString(36).substring(2,12);
    return db.collection('accounts').doc(uid).set({uid:uid,username:user,password:hp(pass),pfp:null,blocked:[],createdAt:fts()})
      .then(function(){
        me={uid:uid,name:user,pfp:null}; myPfpUrl=null;
        localStorage.setItem('d9msg_session',JSON.stringify(me));
        hide('setup'); showApp();
      });
  }).catch(function(e){showErr(err,e.message);});
}
function hp(p){ var h=0; for(var i=0;i<p.length;i++){h=((h<<5)-h)+p.charCodeAt(i);h|=0;} return 'h'+Math.abs(h).toString(16); }

function logout(){
  localStorage.removeItem('d9msg_session');
  me=null; myPfpUrl=null;
  if(unsub){unsub();unsub=null;}
  if(notifUnsub){notifUnsub();notifUnsub=null;}
  hide('app'); byId('in-user').value=''; byId('in-pass').value='';
  show('setup');
}

// ── SHOW APP ──────────────────────────
function showApp(){
  show('app'); setText('my-name',me.name);
  setPfpEl(byId('my-pfp'),myPfpUrl,me.name);
  wire('my-pfp',showPfpModal);
  wire('logout-btn',function(){
    if(!confirm('Sign out of Messages?')) return;
    localStorage.removeItem('d9msg_session');
    me=null; myPfpUrl=null; servers=[]; dms=[];
    if(unsub){unsub();unsub=null;}
    if(notifUnsub){notifUnsub();notifUnsub=null;}
    hide('app');
    byId('in-user').value=''; byId('in-pass').value='';
    show('setup');
    activeChat=null;
  });
  checkBroadcasts();
  wire('logout-btn',logout);
  wire('btn-create',showCreate);
  wire('btn-join',showJoin);
  wire('btn-dm',showDmModal);
  // Show D9 admin button only to admins
  if(isD9Admin()){
    var adminBtn=document.createElement('button');
    adminBtn.className='sb-btn'; adminBtn.textContent='🛡 D9 Admin';
    adminBtn.style.width='100%'; adminBtn.style.marginTop='4px';
    adminBtn.onclick=showD9AdminPanel;
    byId('logout-btn').parentNode.parentNode.appendChild(adminBtn);
  }
  byId('pfp-file').onchange=onPfpFile;
  byId('attach-file').onchange=onAttachFile;
  byId('lightbox').onclick=function(){ byId('lightbox').style.display='none'; };
  requestNotifPermission();
  loadSidebar();
  startNotifListener();
}

// ── SIDEBAR ───────────────────────────
function loadSidebar(){
  db.collection('accounts').doc(me.uid).get().then(function(snap){
    if(snap.exists) blockedIds=(snap.data().blocked||[]);
  });
  db.collection('servers').where('members','array-contains',me.uid).onSnapshot(function(snap){
    servers=snap.docs.map(obj); renderSidebar();
  });
  db.collection('dms').where('members','array-contains',me.uid).onSnapshot(function(snap){
    dms=snap.docs.map(obj).filter(function(d){
      var other=(d.memberNames||[]).find(function(n){return n!==me.name;})||'';

// ── RENDER MESSAGES ───────────────────
function renderMsgs(msgs){
  var area=byId('msgs'); if(!area) return;
  if(!msgs.length){area.innerHTML='<div class="empty-msgs"><div style="font-size:1.8rem;">👋</div>No messages yet!</div>';return;}
  var html='',lastDate='',lastSender='';
  msgs.forEach(function(m,i){
    var ts=m.ts&&m.ts.toDate?m.ts.toDate():new Date();
    var date=ts.toLocaleDateString(),time=ts.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    var self=m.uid===me.uid;
    if(date!==lastDate){
      if(lastSender){html+='<div class="msg-ts">'+time+'</div></div>';lastSender='';}
      html+='<div class="day-div"><span>'+date+'</span></div>';lastDate=date;
    }
    if(m.sender!==lastSender){
      if(lastSender) html+='<div class="msg-ts">'+time+'</div></div>';
      html+='<div class="msg-group'+(self?' self':'')+'"><div class="msg-meta">'
        +'<div class="msg-pfp">'+avHTML(m.pfp||null,m.sender)+'</div>'
        +'<div class="msg-sender">'+h(m.sender)+'</div>'
        +'<div class="msg-ts-sm">'+time+'</div></div>';
      lastSender=m.sender;
    }
    html+=renderBubble(m,self);
    if(i===msgs.length-1) html+='<div class="msg-ts">'+time+'</div></div>';
  });
  area.innerHTML=html;
  area.querySelectorAll('.bubble img').forEach(function(img){
    img.onclick=function(){byId('lb-img').src=img.src;byId('lightbox').style.display='flex';};
  });
  area.scrollTop=area.scrollHeight;
}

function renderBubble(m,self){
  if(m.type==='image'){
    return '<div class="bubble"><img src="'+h(m.url)+'" alt="image" loading="lazy"></div>';
  } else if(m.type==='file'){
    var icon=fileIcon(m.fileName||'');
    return '<div class="bubble"><a class="file-attach" href="'+h(m.url)+'" download="'+h(m.fileName||'file')+'" target="_blank">'
      +'<span class="file-icon">'+icon+'</span>'
      +'<div class="file-info"><div class="file-name">'+h(m.fileName||'file')+'</div>'
      +'<div class="file-size">'+fmtSize(m.fileSize||0)+'</div></div>'
      +'<span style="font-size:.8rem;opacity:.5;">⬇</span></a></div>';
  }
  return '<div class="bubble">'+h(m.text||'')+'</div>';
}

function onAttachFile(e){
  var file=e.target.files[0]; if(!file) return;
  byId('attach-file').value='';
  var ext='.'+file.name.split('.').pop().toLowerCase();
  var banned=BANNED_EXT.includes(ext);
  if(file.size>5*1024*1024){ pushNotif('⚠️','Too large','Files must be under 5MB'); return; }
  var reader=new FileReader();
  reader.onload=function(ev){
    var dataUrl=ev.target.result;
    var isImage=file.type.startsWith('image/');
    if(banned){
      if(!activeChat){ pushNotif('🚫','Blocked','That file type is not allowed here.'); return; }
      var BANNED_LIST='.exe, .bat, .cmd, .sh, .msi, .dmg, .ps1, .vbs, .js, .jar, .app, .scr, .pif, .com, .hta, .wsf';
      // Show approval request as a chat message UI (not sent to Firestore yet)
      var reqId='req_'+Date.now();
      var area=byId('msgs');
      if(area){
        var reqEl=document.createElement('div');
        reqEl.id=reqId;
        reqEl.style.cssText='margin:8px 0;background:rgba(255,165,0,.08);border:1px solid rgba(255,165,0,.25);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;';
        reqEl.innerHTML='<div style="display:flex;align-items:center;gap:8px;">'
          +'<span style="font-size:1.2rem;">⚠️</span>'
          +'<div><div style="font-size:.8rem;font-weight:700;color:#ff9500;">'+h(file.name)+'</div>'
          +'<div style="font-size:.7rem;color:var(--text2);">This file seems to be harmful and cannot be sent without admin approval.</div></div></div>'
          +'<div style="font-size:.68rem;color:var(--text3);line-height:1.6;"><b>Files requiring approval:</b><br>'+BANNED_LIST+'</div>'
          +'<div style="display:flex;gap:8px;align-items:center;">'
          +'<button onclick="submitFileForApproval(\''+reqId+'\','+JSON.stringify(JSON.stringify({url:dataUrl,fileName:file.name,fileSize:file.size,ext:ext}))+');" style="background:#ff9500;border:none;border-radius:6px;padding:6px 14px;color:#fff;font-family:var(--font);font-size:.74rem;font-weight:600;cursor:pointer;">Request Approval</button>'
          +'<button onclick="document.getElementById(\''+reqId+'\').remove();" style="background:var(--glass);border:1px solid var(--border);border-radius:6px;padding:6px 12px;color:var(--text2);font-family:var(--font);font-size:.74rem;cursor:pointer;">Cancel</button>'
          +'</div>';
        area.appendChild(reqEl);
        area.scrollTop=area.scrollHeight;
      }
      return;
    }
    if(isImage){
      var img=new Image(); img.onload=function(){
        var c=document.createElement('canvas'),max=800,scale=Math.min(1,max/Math.max(img.width,img.height));
        c.width=Math.round(img.width*scale); c.height=Math.round(img.height*scale);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        msgCol().add({type:'image',url:c.toDataURL('image/jpeg',.8),uid:me.uid,sender:me.name,pfp:myPfpUrl||null,ts:fts()});
      }; img.src=dataUrl;
    } else {
      msgCol().add({type:'file',url:dataUrl,fileName:file.name,fileSize:file.size,uid:me.uid,sender:me.name,pfp:myPfpUrl||null,ts:fts()});
    }
  };
  reader.readAsDataURL(file);
}

// ── NOTIFICATIONS ─────────────────────
function requestNotifPermission(){
  if('Notification' in window && Notification.permission==='default'){
    Notification.requestPermission();
  }
}

function startNotifListener(){
  // Watch all servers and DMs for new messages while app is open
  notifUnsub=db.collectionGroup('messages').where('uid','!=',me.uid)
    .orderBy('uid').orderBy('ts','desc').limit(1)
    .onSnapshot(function(snap){
      snap.docChanges().forEach(function(change){
        if(change.type!=='added') return;
        var m=change.doc.data();
        var ts=m.ts&&m.ts.toDate?m.ts.toDate():new Date();
        var age=(Date.now()-ts.getTime())/1000;
        if(age>5) return; // ignore old messages on load
        pushNotif('💬',h(m.sender),h(m.text||'Sent an attachment'));
      });
    });
}

function pushNotif(icon,title,text){
  // In-app notification
  var stack=byId('notif-stack');
  var item=document.createElement('div');
  item.className='notif-item';
  item.innerHTML='<div class="notif-icon">'+icon+'</div>'
    +'<div class="notif-body"><div class="notif-title">'+title+'</div>'
    +'<div class="notif-text">'+text+'</div></div>'
    +'<button class="notif-close" onclick="this.parentNode.remove()">✕</button>';
  stack.appendChild(item);
  setTimeout(function(){ if(item.parentNode) item.remove(); },5000);
  // Browser push notification (when tab not focused)
  if(document.hidden && 'Notification' in window && Notification.permission==='granted'){
    new Notification(title,{body:text,icon:'https://via.placeholder.com/64/0078d4/ffffff?text=💬'});
  }
}

          ref.collection('messages').get().then(function(snap){
            var batch=db.batch();
            snap.docs.forEach(function(d){batch.delete(d.ref);});

      var s=doc.data();
      return '<div class="member-item">'
        +'<div class="member-av" style="border-radius:7px;">'+h(s.icon||'🗨️')+'</div>'
        +'<div class="member-info" style="flex:1;min-width:0;">'
        +'<div class="member-name">'+h(s.name)+'</div>'
        +'<div style="font-size:.62rem;color:var(--text3);">'+(s.members?s.members.length:0)+' members · Code: '+h(s.code)+'</div>'
        +'</div>'
        +'<div class="member-actions">'
        +'<button class="mini-btn danger" onclick="adminDeleteServer(\''+doc.id+'\',\''+h(s.name)+'\')">Delete</button>'
        +'</div></div>';
    }).join('');
    modal('<div class="modal-title">🏠 All Servers ('+snap.docs.length+')</div>'
      +'<div style="max-height:300px;overflow-y:auto;">'+(rows||'<div style="color:var(--text3);font-size:.78rem;padding:8px;">No servers yet</div>')+'</div>'
      +'<div class="modal-row"><button class="mbtn ghost" id="m-back">← Back</button></div>',
      function(el){ wire2(el,'m-back',function(){ closeModal(); showD9AdminPanel(); }); });
  });
}

function adminDeleteServer(serverId,name){
  if(!confirm('Delete server "'+name+'"? This removes ALL messages and cannot be undone.')) return;
  var ref=db.collection('servers').doc(serverId);
  ref.collection('messages').get().then(function(snap){
    var batch=db.batch();
    snap.docs.forEach(function(d){batch.delete(d.ref);});
    batch.delete(ref);
    return batch.commit();
  }).then(function(){
    toast('"'+name+'" deleted.');
    if(activeChat&&activeChat.id===serverId){
      activeChat=null;
      byId('main-area').innerHTML='<div class="no-chat"><div style="font-size:2rem;">💬</div>Server was deleted.</div>';
    }
    closeModal(); showAllServers();
  });
}

// ── BROADCAST ─────────────────────────
function showBroadcast(){
  modal('<div class="modal-title">📢 Broadcast Notification</div>'
    +'<div class="modal-sub">Sends a notification to ALL users next time they open Messages.</div>'
    +'<input class="inp" id="m-msg" placeholder="Your message…" maxlength="200">'
    +'<div class="err" id="m-err"></div>'
    +'<div class="modal-row">'
    +'<button class="mbtn ghost" id="m-back">← Back</button>'
    +'<button class="mbtn" id="m-ok">📢 Send to All</button>'
    +'</div>',
    function(el){
      wire2(el,'m-back',function(){ closeModal(); showD9AdminPanel(); });
      wire2(el,'m-ok',function(){
        var msg=el.querySelector('#m-msg').value.trim();
        var err=el.querySelector('#m-err');
        if(!msg){showErr(err,'Enter a message.');return;}
        db.collection('d9_broadcasts').add({
          message:msg, target:'all', sentBy:me.name,
          ts:fts()
        }).then(function(){
          closeModal();
          toast('Broadcast sent to all users!');
        });
      });
    });
}

// Check for broadcasts on login
function checkBroadcasts(){
  var lastCheck=localStorage.getItem('d9msg_last_broadcast')||'0';
  db.collection('d9_broadcasts')
    .where('target','==','all')
    .orderBy('ts','desc').limit(5).get().then(function(snap){
      snap.docs.forEach(function(doc){
        var b=doc.data();
        var ts=b.ts&&b.ts.toDate?b.ts.toDate().getTime():0;
        if(ts>parseInt(lastCheck)){
          pushNotif('📢','Draft 9 Admin',b.message);
        }
      });
      localStorage.setItem('d9msg_last_broadcast',Date.now().toString());
    });
  // Also check personal bans
  db.collection('accounts').doc(me.uid).get().then(function(snap){
    if(snap.exists&&snap.data().banned){
      localStorage.removeItem('d9msg_session');
      me=null; hide('app'); show('setup');
      setTimeout(function(){
        modal('<div class="modal-title">🚫 Account Banned</div>'
          +'<div class="modal-sub">Your account has been banned from Draft 9 by an administrator.</div>'
          +'<button class="mbtn ghost" id="m-ok">OK</button>',
          function(el){ wire2(el,'m-ok',closeModal); });
      },200);
    }
  });
}

function reviewFile(docId,approve,fJson){
  var ref=db.collection('d9_pending_files').doc(docId);
  if(approve && fJson){
    var f=JSON.parse(fJson);
    var col=f.chatType==='server'
      ?db.collection('servers').doc(f.chatId).collection('messages')
      :db.collection('dms').doc(f.chatId).collection('messages');
    col.add({type:'file',url:f.url,fileName:f.fileName,fileSize:f.fileSize,uid:f.senderUid,sender:f.sender,pfp:f.senderPfp||null,approvedByD9Admin:true,ts:fts()});
    ref.update({status:'approved'});
    toast('File approved and posted to chat.');
  } else {
    ref.update({status:'denied'});
    toast('File denied.');
  }
  closeModal();
}

function kickMember(serverId,uid,name){
  if(!confirm('Kick '+name+' from this server?')) return;
  db.collection('servers').doc(serverId).update({
    members:firebase.firestore.FieldValue.arrayRemove(uid),
    memberNames:firebase.firestore.FieldValue.arrayRemove(name)
  }).then(function(){ toast(name+' kicked.'); closeModal(); });
}

// ── BLOCK ─────────────────────────────
function showBlockConfirm(name,uid,dmId){
  modal('<div class="modal-title">🚫 Block '+h(name)+'</div>'
    +'<div class="modal-sub">Blocking will remove this DM and prevent them from messaging you. You can unblock from Settings later.</div>'
    +'<div class="modal-row"><button class="mbtn ghost" id="m-cancel">Cancel</button>'
    +'<button class="mbtn danger" id="m-ok">Block</button></div>',
    function(el){
      wire2(el,'m-cancel',closeModal);
      wire2(el,'m-ok',function(){
        // Add to blocked list
        db.collection('accounts').doc(me.uid).update({
          blocked:firebase.firestore.FieldValue.arrayUnion(uid)
        });
        // Delete DM
        db.collection('dms').doc(dmId).collection('messages').get().then(function(snap){
          var batch=db.batch();
          snap.docs.forEach(function(d){batch.delete(d.ref);});
          batch.delete(db.collection('dms').doc(dmId));
          return batch.commit();
        }).then(function(){
          blockedIds.push(uid);
          closeModal(); activeChat=null;
          byId('main-area').innerHTML='<div class="no-chat"><div style="font-size:2rem;">💬</div>Pick a server or DM to start</div>';
          toast(name+' blocked and DM removed.');
        });
      });
    });
}

// ── PROFILE PICTURE ───────────────────
function showPfpModal(){
  modal('<div class="modal-title">🖼 Profile Picture</div>'
    +'<div class="modal-sub">Your picture shows next to all your messages.</div>'
    +(myPfpUrl?'<img src="'+myPfpUrl+'" style="width:72px;height:72px;border-radius:50%;object-fit:cover;align-self:center;">':'<div style="text-align:center;color:var(--text3);font-size:.74rem;">No picture set</div>')
    +'<div class="modal-row">'
    +'<button class="mbtn ghost" id="m-cancel">Cancel</button>'
    +'<button class="mbtn" id="m-upload">Upload</button>'
    +(myPfpUrl?'<button class="mbtn danger" id="m-remove">Remove</button>':'')
    +'</div>',
    function(el){
      wire2(el,'m-cancel',closeModal);
      var up=el.querySelector('#m-upload');
      if(up) up.onclick=function(){byId('pfp-file').click();closeModal();};
      var rm=el.querySelector('#m-remove');
      if(rm) rm.onclick=function(){savePfp(null);closeModal();};
    });
}
function onPfpFile(e){
  var file=e.target.files[0]; if(!file) return; byId('pfp-file').value='';
  var reader=new FileReader();
  reader.onload=function(ev){
    var img=new Image(); img.onload=function(){
      var c=document.createElement('canvas'); c.width=c.height=128;
      var s=Math.min(img.width,img.height),ox=(img.width-s)/2,oy=(img.height-s)/2;
      c.getContext('2d').drawImage(img,ox,oy,s,s,0,0,128,128);
      savePfp(c.toDataURL('image/jpeg',.8));
    }; img.src=ev.target.result;
  }; reader.readAsDataURL(file);
}
function savePfp(url){
  myPfpUrl=url; me.pfp=url; localStorage.setItem('d9msg_session',JSON.stringify(me));
  db.collection('accounts').doc(me.uid).update({pfp:url});
  setPfpEl(byId('my-pfp'),url,me.name);
  toast(url?'Profile picture updated!':'Profile picture removed.');
}

// ── CREATE / JOIN / DM ────────────────
function showCreate(){
  modal('<div class="modal-title">🏠 Create Server</div>'
    +'<div class="modal-sub">Only people with your invite code can join.</div>'
    +'<input class="inp" id="m-sname" placeholder="Server name" maxlength="30">'
    +'<input class="inp" id="m-sicon" placeholder="Emoji icon e.g. 🎮" maxlength="4" style="margin-top:6px;">'
    +'<div class="err" id="m-err"></div>'
    +'<div class="modal-row"><button class="mbtn ghost" id="m-cancel">Cancel</button><button class="mbtn" id="m-ok">Create</button></div>',
    function(el){
      wire2(el,'m-cancel',closeModal);
      wire2(el,'m-ok',function(){
        var name=el.querySelector('#m-sname').value.trim();
        var icon=el.querySelector('#m-sicon').value.trim()||'🗨️';
        var err=el.querySelector('#m-err');
        if(!name){showErr(err,'Enter a server name.');return;}
        var code=genCode();
        db.collection('servers').add({name:name,icon:icon,code:code,owner:me.uid,members:[me.uid],memberNames:[me.name],createdAt:fts()})
          .then(function(ref){closeModal();toast('"'+name+'" created! Code: '+code);openServerChat({id:ref.id,name:name,icon:icon,code:code,owner:me.uid,members:[me.uid]});});
      });
    });
}

function showJoin(){
  modal('<div class="modal-title">🔑 Join Server</div>'
    +'<div class="modal-sub">Enter the invite code someone shared with you.</div>'
    +'<input class="inp" id="m-code" placeholder="6-character code" maxlength="6" style="text-transform:uppercase;letter-spacing:.12em;font-family:monospace;">'
    +'<div class="err" id="m-err"></div>'
    +'<div class="modal-row"><button class="mbtn ghost" id="m-cancel">Cancel</button><button class="mbtn" id="m-ok">Join</button></div>',
    function(el){
      wire2(el,'m-cancel',closeModal);
      wire2(el,'m-ok',function(){
        var code=el.querySelector('#m-code').value.trim().toUpperCase();
        var err=el.querySelector('#m-err');
        if(!code) return;
        db.collection('servers').where('code','==',code).get().then(function(snap){
          if(snap.empty){showErr(err,'Server not found.');return;}
          var sDoc=snap.docs[0],s=sDoc.data();
          if((s.members||[]).includes(me.uid)){toast("Already in that server!");closeModal();return;}
          db.collection('servers').doc(sDoc.id).update({
            members:firebase.firestore.FieldValue.arrayUnion(me.uid),
            memberNames:firebase.firestore.FieldValue.arrayUnion(me.name)
          }).then(function(){closeModal();toast('Joined "'+s.name+'"!');openServerChat({id:sDoc.id,name:s.name,icon:s.icon||'🗨️',code:s.code,owner:s.owner,members:(s.members||[]).concat([me.uid])});});
        }).catch(function(e){showErr(err,e.message);});
      });
    });
}

function showDmModal(){
  modal('<div class="modal-title">👤 New DM</div>'
    +'<div class="modal-sub">Only you and this person will see this conversation.</div>'
    +'<input class="inp" id="m-user" placeholder="Their username" maxlength="32">'
    +'<div class="err" id="m-err"></div>'
    +'<div class="modal-row"><button class="mbtn ghost" id="m-cancel">Cancel</button><button class="mbtn" id="m-ok">Start DM</button></div>',
    function(el){
      wire2(el,'m-cancel',closeModal);
      wire2(el,'m-ok',function(){
        var target=el.querySelector('#m-user').value.trim();
        var err=el.querySelector('#m-err');
        if(!target) return;
        if(target===me.name){showErr(err,"Can't DM yourself!");return;}
        var existing=dms.find(function(d){return (d.memberNames||[]).includes(target);});
        if(existing){closeModal();openDmChat(existing);return;}
        db.collection('accounts').where('username','==',target).get().then(function(snap){
          if(snap.empty){showErr(err,'"'+target+'" not found.');return;}
          var tu=snap.docs[0].data();
          if((tu.blocked||[]).includes(me.uid)){showErr(err,"You can't message this user.");return;}
          var pfpMap={};pfpMap[me.name]=myPfpUrl||null;pfpMap[target]=tu.pfp||null;
          db.collection('dms').add({members:[me.uid,tu.uid],memberNames:[me.name,target],memberPfps:pfpMap,createdAt:fts()})
            .then(function(ref){closeModal();openDmChat({id:ref.id,memberNames:[me.name,target],memberPfps:pfpMap,members:[me.uid,tu.uid]});});
        }).catch(function(e){showErr(err,e.message);});
      });
    });
}

// ── UTILS ─────────────────────────────
function modal(html,wire){
  closeModal();
  var bg=document.createElement('div');bg.className='modal-bg';bg.id='modal-bg';
  var m=document.createElement('div');m.className='modal';m.innerHTML=html;
  bg.appendChild(m);document.body.appendChild(bg);
  bg.onclick=function(e){if(e.target===bg) closeModal();};
  if(wire) wire(m);
}
function closeModal(){var el=byId('modal-bg');if(el) el.remove();}
function avHTML(pfp,name){
  if(pfp) return '<img src="'+pfp+'" alt="'+h((name||'?')[0])+'">';
  return h((name||'?')[0].toUpperCase());
}
function setPfpEl(el,pfp,name){
  if(!el) return;
  el.innerHTML=pfp?'<img src="'+pfp+'" alt="pfp">':h((name||'?')[0].toUpperCase());
}
function fileIcon(name){
  var ext=(name.split('.').pop()||'').toLowerCase();
  var map={pdf:'📄',doc:'📝',docx:'📝',xls:'📊',xlsx:'📊',zip:'🗜',rar:'🗜','7z':'🗜',mp3:'🎵',wav:'🎵',mp4:'🎬',mov:'🎬',txt:'📃'};
  return map[ext]||'📁';
}
function fmtSize(b){if(b<1024) return b+'B';if(b<1048576) return (b/1024).toFixed(1)+'KB';return (b/1048576).toFixed(1)+'MB';}
function genCode(){return Math.random().toString(36).substring(2,8).toUpperCase();}
function fts(){return firebase.firestore.FieldValue.serverTimestamp();}
function byId(id){return document.getElementById(id);}
function val(id){var el=byId(id);return el?el.value.trim():'';}
function setText(id,t){var el=byId(id);if(el) el.textContent=t;}
function hide(id){var el=byId(id);if(el) el.style.display='none';}
function show(id){var el=byId(id);if(el) el.style.display='flex';}
function wire(id,fn){var el=byId(id);if(el) el.onclick=fn;}
function wire2(p,id,fn){var el=p.querySelector('#'+id);if(el) el.onclick=fn;}
function on(id,ev,fn){var el=byId(id);if(el) el.addEventListener(ev,fn);}
function obj(d){return Object.assign({id:d.id},d.data());}
function showErr(el,msg){if(!el) return;el.textContent=msg;el.classList.add('show');}
function h(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
var toastT;
function toast(msg){var t=byId('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},3000);}
</script>
