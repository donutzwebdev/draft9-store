<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notes</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--accent:#0078d4;--bg:#0d0d1a;--glass:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.12);--border:rgba(255,255,255,.12);--text:#f3f3f3;--text2:rgba(243,243,243,.65);--text3:rgba(243,243,243,.35);--font:'Inter',system-ui,sans-serif;}
body{font-family:var(--font);background:var(--bg);color:var(--text);height:100vh;display:flex;overflow:hidden;}
.sidebar{width:200px;border-right:1px solid var(--border);display:flex;flex-direction:column;background:rgba(0,0,0,.2);flex-shrink:0;}
.sb-top{padding:10px;border-bottom:1px solid var(--border);display:flex;gap:6px;}
.sb-title{font-size:.82rem;font-weight:700;flex:1;}
.new-btn{background:var(--accent);border:none;border-radius:6px;padding:4px 10px;color:#fff;font-size:.72rem;cursor:pointer;font-family:var(--font);}
.note-list{flex:1;overflow-y:auto;padding:6px;}
.note-item{padding:8px 10px;border-radius:7px;cursor:pointer;margin-bottom:3px;transition:background .13s;border:1px solid transparent;}
.note-item:hover{background:var(--glass);}
.note-item.active{background:var(--glass2);border-color:var(--border);}
.note-title{font-size:.76rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.note-preview{font-size:.62rem;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.note-date{font-size:.58rem;color:var(--text3);margin-top:2px;}
.del-btn{float:right;background:none;border:none;color:var(--text3);cursor:pointer;font-size:.75rem;padding:0;}
.del-btn:hover{color:#ff6b6b;}
.main{flex:1;display:flex;flex-direction:column;}
.editor-top{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
.note-title-inp{flex:1;background:none;border:none;color:var(--text);font-size:1rem;font-weight:700;font-family:var(--font);outline:none;}
.note-title-inp::placeholder{color:var(--text3);}
.save-ind{font-size:.65rem;color:var(--text3);flex-shrink:0;}
.editor{flex:1;padding:14px;font-size:.84rem;line-height:1.7;color:var(--text);background:none;border:none;resize:none;outline:none;font-family:var(--font);}
.editor::placeholder{color:var(--text3);}
.empty-state{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--text3);font-size:.8rem;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:2px;}
</style></head><body>
<div class="sidebar">
  <div class="sb-top"><div class="sb-title">📝 Notes</div><button class="new-btn" id="new-btn">+ New</button></div>
  <div class="note-list" id="note-list"></div>
</div>
<div class="main" id="main">
  <div class="empty-state"><div style="font-size:2.5rem;">📝</div>Select a note or create one</div>
</div>
<script>
var notes={},activeId=null,saveTimer=null;
function load(){try{notes=JSON.parse(localStorage.getItem('d9_notes')||'{}');}catch(e){notes={};}render();}
function save(){localStorage.setItem('d9_notes',JSON.stringify(notes));}
function render(){
  var list=document.getElementById('note-list');
  var sorted=Object.values(notes).sort(function(a,b){return (b.updated||0)-(a.updated||0);});
  list.innerHTML=sorted.length?sorted.map(function(n){
    return '<div class="note-item'+(activeId===n.id?' active':'')+'" data-id="'+n.id+'">'
      +'<button class="del-btn" data-del="'+n.id+'">✕</button>'
      +'<div class="note-title">'+(n.title||'Untitled')+'</div>'
      +'<div class="note-preview">'+(n.body||'').substring(0,40)+'</div>'
      +'<div class="note-date">'+new Date(n.updated||Date.now()).toLocaleDateString()+'</div>'
      +'</div>';
  }).join(''):'<div style="font-size:.7rem;color:var(--text3);padding:8px;">No notes yet</div>';
  list.querySelectorAll('.note-item').forEach(function(el){
    el.onclick=function(e){ if(e.target.dataset.del) return; openNote(el.dataset.id); };
  });
  list.querySelectorAll('[data-del]').forEach(function(el){
    el.onclick=function(e){ e.stopPropagation(); delNote(el.dataset.del); };
  });
}
function openNote(id){
  activeId=id; var n=notes[id];
  document.getElementById('main').innerHTML=
    '<div class="editor-top">'
    +'<input class="note-title-inp" id="ntitle" placeholder="Note title…" value="'+esc(n.title||'')+'">'
    +'<span class="save-ind" id="sind">Saved</span></div>'
    +'<textarea class="editor" id="nbody" placeholder="Start writing…">'+esc(n.body||'')+'</textarea>';
  document.getElementById('ntitle').oninput=function(){ notes[id].title=this.value; schedSave(id); };
  document.getElementById('nbody').oninput=function(){ notes[id].body=this.value; schedSave(id); };
  render();
}
function schedSave(id){
  document.getElementById('sind').textContent='Saving…';
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){ notes[id].updated=Date.now(); save(); render(); document.getElementById('sind').textContent='Saved'; },600);
}
function newNote(){
  var id='n'+Date.now(); notes[id]={id:id,title:'',body:'',updated:Date.now()}; save(); render(); openNote(id);
}
function delNote(id){
  if(id===activeId){activeId=null;document.getElementById('main').innerHTML='<div class="empty-state"><div style="font-size:2.5rem;">📝</div>Select a note or create one</div>';}
  delete notes[id]; save(); render();
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
document.getElementById('new-btn').onclick=newNote;
load();
</script></body></html>
