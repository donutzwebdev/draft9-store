<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Snake Game</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 2.5rem;
            letter-spacing: 2px;
            color: #4CAF50;
        }

        #score-board {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        #score-board span {
            font-weight: bold;
            color: #FF5722;
        }

        #game-container {
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border-radius: 4px;
        }

        canvas {
            background-color: #111;
            border: 4px solid #333;
            display: block;
            border-radius: 4px;
        }

        #game-over-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }

        #game-over-screen h2 {
            color: #f44336;
            font-size: 3rem;
            margin: 0 0 10px 0;
        }

        #btn-restart {
            padding: 10px 20px;
            font-size: 1.1rem;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        #btn-restart:hover {
            background-color: #45a049;
        }

        .controls-hint {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #888;
        }
    </style>
</head>
<body>

    <h1>SNAKE</h1>
    <div id="score-board">Score: <span id="score">0</span> | High Score: <span id="high-score">0</span></div>

    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div id="game-over-screen" id="gameOverScreen">
            <h2>Game Over</h2>
            <button id="btn-restart" onclick="resetGame()">Play Again</button>
        </div>
    </div>

    <div class="controls-hint">Use <b>Arrow Keys</b> or <b>WASD</b> to move.</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const highScoreElement = document.getElementById("high-score");
        const gameOverScreen = document.getElementById("game-over-screen");

        // Grid and game speed config
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        const gameSpeed = 100; // Milliseconds per frame (lower is faster)

        // Game state variables
        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = gridSize; // Horizontal velocity
        let dy = 0;        // Vertical velocity
        let score = 0;
        let highScore = localStorage.getItem("snakeHighScore") || 0;
        let gameInterval;
        let changingDirection = false;

        highScoreElement.innerText = highScore;

        // Start the game
        resetGame();

        function resetGame() {
            snake = [
                { x: gridSize * 5, y: gridSize * 5 },
                { x: gridSize * 4, y: gridSize * 5 },
                { x: gridSize * 3, y: gridSize * 5 }
            ];
            score = 0;
            scoreElement.innerText = score;
            dx = gridSize;
            dy = 0;
            gameOverScreen.style.display = "none";
            generateFood();
            clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, gameSpeed);
        }

        function gameLoop() {
            if (hasGameEnded()) {
                gameOverScreen.style.display = "flex";
                clearInterval(gameInterval);
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem("snakeHighScore", highScore);
                    highScoreElement.innerText = highScore;
                }
                return;
            }

            changingDirection = false;
            clearCanvas();
            drawFood();
            moveSnake();
            drawSnake();
        }

        function clearCanvas() {
            ctx.fillStyle = "#111";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                // Head is brighter green than body
                ctx.fillStyle = index === 0 ? "#4CAF50" : "#8BC34A";
                ctx.strokeStyle = "#111";
                ctx.fillRect(part.x, part.y, gridSize, gridSize);
                ctx.strokeRect(part.x, part.y, gridSize, gridSize);
            });
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            const hasEatenFood = snake[0].x === food.x && snake[0].y === food.y;
            if (hasEatenFood) {
                score += 10;
                scoreElement.innerText = score;
                generateFood();
            } else {
                snake.pop(); // Remove tail if food wasn't eaten
            }
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount) * gridSize;
            food.y = Math.floor(Math.random() * tileCount) * gridSize;

            // Prevent food from spawning inside the snake
            snake.forEach(part => {
                const hasEaten = part.x === food.x && part.y === food.y;
                if (hasEaten) generateFood();
            });
        }

        function drawFood() {
            ctx.fillStyle = "#FF5722";
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#FF5722";
            ctx.fillRect(food.x, food.y, gridSize, gridSize);
            ctx.shadowBlur = 0; // Reset shadow for snake drawing
        }

        function hasGameEnded() {
            // Self collision check
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }

            // Wall collision check
            const hitLeftWall = snake[0].x < 0;
            const hitRightWall = snake[0].x >= canvas.width;
            const hitToptWall = snake[0].y < 0;
            const hitBottomWall = snake[0].y >= canvas.height;

            return hitLeftWall || hitRightWall || hitToptWall || hitBottomWall;
        }

        // Handle controls
        document.addEventListener("keydown", changeDirection);

        function changeDirection(event) {
            const keyPressed = event.keyCode;
            const key = event.key.toLowerCase();

            // Prevent quick double taps triggering backwards movement self-collision
            if (changingDirection) return;

            const goingUp = dy === -gridSize;
            const goingDown = dy === gridSize;
            const goingRight = dx === gridSize;
            const goingLeft = dx === -gridSize;

            // Arrow Up or W
            if ((keyPressed === 38 || key === 'w') && !goingDown) {
                dx = 0;
                dy = -gridSize;
                changingDirection = true;
            }
            // Arrow Down or S
            if ((keyPressed === 40 || key === 's') && !goingUp) {
                dx = 0;
                dy = gridSize;
                changingDirection = true;
            }
            // Arrow Left or A
            if ((keyPressed === 37 || key === 'a') && !goingRight) {
                dx = -gridSize;
                dy = 0;
                changingDirection = true;
            }
            // Arrow Right or D
            if ((keyPressed === 39 || key === 'd') && !goingLeft) {
                dx = gridSize;
                dy = 0;
                changingDirection = true;
            }
            
            // Prevent browser scrolling with arrow keys/spacebar
            if([32, 37, 38, 39, 40].indexOf(event.keyCode) > -1) {
                event.preventDefault();
            }
        }
    </script>
</body>
</html>
