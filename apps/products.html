<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --accent:#0078d4;--accent2:#1a8fe3;--bg:#0d0d1a;
  --glass:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.12);
  --border:rgba(255,255,255,.12);--border2:rgba(255,255,255,.2);
  --text:#f3f3f3;--text2:rgba(243,243,243,.65);--text3:rgba(243,243,243,.35);
  --orange:#ff9500;--green:#28c840;--red:#ff5f57;
  --font:'Inter',system-ui,sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* TOPBAR */
.topbar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--border);background:rgba(0,0,0,.3);flex-shrink:0;}
.logo{font-size:.92rem;font-weight:700;flex:1;}
.site-tabs{display:flex;gap:4px;}
.site-tab{background:var(--glass);border:1px solid var(--border);border-radius:6px;padding:5px 12px;color:var(--text2);font-size:.7rem;font-family:var(--font);cursor:pointer;transition:all .15s;}
.site-tab:hover{background:var(--glass2);color:var(--text);}
.site-tab.active{background:var(--accent);border-color:transparent;color:#fff;}
.tbtn{background:var(--glass);border:1px solid var(--border);border-radius:6px;padding:5px 12px;color:var(--text2);font-size:.7rem;font-family:var(--font);cursor:pointer;white-space:nowrap;}
.tbtn:hover{background:var(--glass2);color:var(--text);}
.tbtn.orange{background:rgba(255,149,0,.15);border-color:rgba(255,149,0,.3);color:var(--orange);}
.tbtn.orange:hover{background:rgba(255,149,0,.25);}

/* URL BAR */
.urlbar{display:flex;align-items:center;gap:6px;padding:6px 14px;border-bottom:1px solid var(--border);background:rgba(0,0,0,.2);flex-shrink:0;}
.url-inp{flex:1;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:20px;padding:5px 14px;color:var(--text);font-family:var(--font);font-size:.78rem;outline:none;}
.url-inp:focus{border-color:var(--accent);}
.url-go{background:var(--accent);border:none;border-radius:20px;padding:5px 14px;color:#fff;font-size:.72rem;font-family:var(--font);cursor:pointer;}
.nav-btn{background:var(--glass);border:1px solid var(--border);border-radius:6px;padding:5px 10px;color:var(--text2);font-size:.8rem;cursor:pointer;}
.nav-btn:hover{background:var(--glass2);}

/* BROWSER FRAME */
.browser-wrap{flex:1;position:relative;overflow:hidden;}
iframe{width:100%;height:100%;border:none;}

/* ORDER BUTTON — floating */
.order-fab{position:absolute;bottom:20px;right:20px;background:var(--accent);border:none;border-radius:14px;padding:12px 20px;color:#fff;font-size:.84rem;font-weight:700;font-family:var(--font);cursor:pointer;box-shadow:0 4px 20px rgba(0,120,212,.5);z-index:50;display:flex;align-items:center;gap:8px;transition:all .18s;}
.order-fab:hover{background:var(--accent2);transform:scale(1.04);box-shadow:0 6px 24px rgba(0,120,212,.6);}
.custom-fab{position:absolute;bottom:20px;left:20px;background:rgba(255,149,0,.15);border:1px solid rgba(255,149,0,.4);border-radius:14px;padding:10px 16px;color:var(--orange);font-size:.78rem;font-weight:700;font-family:var(--font);cursor:pointer;z-index:50;transition:all .18s;}
.custom-fab:hover{background:rgba(255,149,0,.25);}

/* NOTICE BAR */
.notice{background:rgba(0,120,212,.08);border-bottom:1px solid rgba(0,120,212,.2);padding:5px 14px;font-size:.68rem;color:var(--accent);flex-shrink:0;display:flex;align-items:center;gap:6px;}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(6px);}
.modal{background:rgba(12,12,26,.98);border:1px solid var(--border2);border-radius:16px;padding:26px;width:min(420px,95vw);max-height:90vh;overflow-y:auto;display:flex;flex-direction:column;gap:13px;box-shadow:0 16px 48px rgba(0,0,0,.7);}
.modal-title{font-size:.98rem;font-weight:700;}
.modal-sub{font-size:.74rem;color:var(--text2);margin-top:-7px;line-height:1.6;}
.inp-label{font-size:.66rem;color:var(--text2);font-weight:600;margin-bottom:3px;}
.inp{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-family:var(--font);font-size:.84rem;outline:none;width:100%;}
.inp:focus{border-color:var(--accent);}
.modal-row{display:flex;gap:8px;}
.mbtn{flex:1;background:var(--accent);border:none;border-radius:8px;padding:9px;color:#fff;font-weight:600;font-size:.8rem;cursor:pointer;font-family:var(--font);}
.mbtn:hover{background:var(--accent2);}
.mbtn.ghost{background:var(--glass);border:1px solid var(--border);color:var(--text2);}
.mbtn.ghost:hover{background:var(--glass2);color:var(--text);}
.mbtn.orange{background:rgba(255,149,0,.15);border:1px solid rgba(255,149,0,.3);color:var(--orange);}
.merr{font-size:.7rem;color:var(--red);display:none;}
.merr.show{display:block;}
.url-preview{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:7px;padding:8px 11px;font-size:.7rem;color:var(--text3);word-break:break-all;font-family:monospace;}

#toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%) translateY(8px);background:rgba(12,12,26,.96);border:1px solid var(--border2);border-radius:9px;padding:9px 18px;font-size:.76rem;box-shadow:0 4px 16px rgba(0,0,0,.5);opacity:0;transition:all .22s;pointer-events:none;z-index:300;white-space:nowrap;}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
</style>
</head>
<body>

<script>
const EMAILJS_PUBLIC_KEY  = 'dFYBlFg2IgkjJLGV0';
const EMAILJS_SERVICE_ID  = 'service_ijg7j8g';
const EMAILJS_TEMPLATE_ID = 'template_1s8n1ll';
emailjs.init(EMAILJS_PUBLIC_KEY);

var currentUrl = 'https://makerworld.com/en';

var SITES = [
  { name:'MakerWorld',    url:'https://makerworld.com/en',      emoji:'🌍' },
  { name:'Printables',    url:'https://www.printables.com',     emoji:'🔴' },
  { name:'Thingiverse',   url:'https://www.thingiverse.com',   emoji:'📦' },
  { name:'Cults3D',       url:'https://cults3d.com',            emoji:'✦'  },
  { name:'MyMiniFactory', url:'https://www.myminifactory.com',  emoji:'⭐' },
];

var currentUrl = 'https://makerworld.com/en';
var PROXY_PAGE = 'https://donutzwebdev.github.io/scramjet/';</script>

<div class="topbar">
  <div class="logo">🖨️ Products</div>
  <div class="site-tabs" id="site-tabs"></div>
  <button class="tbtn orange" onclick="showCustomOrder()" style="margin-left:auto;">✏️ Custom Request</button>
</div>

<div class="notice">💡 Browse any 3D model site below. When you find something you want printed, hit the <b>Order This Print</b> button!</div>

<div class="urlbar">
  <button class="nav-btn" onclick="document.getElementById('browser').contentWindow.history.back()">←</button>
  <button class="nav-btn" onclick="document.getElementById('browser').contentWindow.history.forward()">→</button>
  <button class="nav-btn" onclick="reloadFrame()">↻</button>
  <input class="url-inp" id="url-inp" placeholder="Enter URL or search…" onkeydown="if(event.key==='Enter') goUrl()">
  <button class="url-go" onclick="goUrl()">Go</button>
</div>

<div class="browser-wrap">
  <iframe id="browser" src="https://donutzwebdev.github.io/scramjet/?url=https%3A%2F%2Fmakerworld.com%2Fen" onload="onFrameLoad()"></iframe>
  <button class="order-fab" onclick="showOrder()">🛒 Order This Print</button>
  <button class="custom-fab" onclick="showCustomOrder()">✏️ Custom</button>
</div>

<div id="toast"></div>

<script>
// Build site tabs
var tabsEl = document.getElementById('site-tabs');
SITES.forEach(function(s, i) {
  var btn = document.createElement('button');
  btn.className = 'site-tab' + (i===0?' active':'');
  btn.textContent = s.emoji + ' ' + s.name;
  btn.onclick = function() {
    document.querySelectorAll('.site-tab').forEach(function(t){ t.classList.remove('active'); });
    btn.classList.add('active');
    loadUrl(s.url);
  };
  tabsEl.appendChild(btn);
});

function loadUrl(url) {
  if (!url.startsWith('http')) url = 'https://' + url;
  currentUrl = url;
  document.getElementById('url-inp').value = url;
  // Navigate proxy page via postMessage if already loaded, otherwise reload with new url param
  var frame = document.getElementById('browser');
  var proxyUrl = PROXY_PAGE + '?url=' + encodeURIComponent(url);
  frame.src = proxyUrl;
}

function goUrl() {
  var v = document.getElementById('url-inp').value.trim();
  if (!v) return;
  if (!v.startsWith('http')) v = 'https://' + v;
  loadUrl(v);
}

function reloadFrame() {
  var f = document.getElementById('browser');
  f.src = f.src;
}

function onFrameLoad() {
  try {
    var f = document.getElementById('browser');
    var url = f.contentWindow.location.href;
    if (url && url !== 'about:blank') {
      currentUrl = url;
      document.getElementById('url-inp').value = url;
      // Update active tab
      document.querySelectorAll('.site-tab').forEach(function(t){ t.classList.remove('active'); });
      SITES.forEach(function(s, i) {
        if (url.includes(new URL(s.url).hostname)) {
          document.querySelectorAll('.site-tab')[i]?.classList.add('active');
        }
      });
    }
  } catch(e) { /* cross-origin, can't read URL — that's fine */ }
}

// ── ORDER MODAL ───────────────────────
function showOrder() {
  var url = currentUrl;
  modal('<div class="modal-title">🛒 Order This Print</div>'
    +'<div class="modal-sub">We\'ll print this model and ship it to you. Fill in your details below.</div>'
    +'<div><div class="inp-label">Model Link</div><div class="url-preview">'+h(url)+'</div></div>'
    +'<div><div class="inp-label">Your Name *</div><input class="inp" id="o-name" placeholder="Your name"></div>'
    +'<div><div class="inp-label">Email Address *</div><input class="inp" id="o-email" type="email" placeholder="your@email.com"></div>'
    +'<div><div class="inp-label">Phone (optional)</div><input class="inp" id="o-phone" placeholder="+1 (555) 000-0000"></div>'
    +'<div><div class="inp-label">Shipping Address *</div><textarea class="inp" id="o-addr" rows="2" placeholder="Street, City, State, ZIP"></textarea></div>'
    +'<div><div class="inp-label">Color Preference</div><input class="inp" id="o-color" placeholder="e.g. Red, Blue, Black, Any…"></div>'
    +'<div><div class="inp-label">Special Notes</div><textarea class="inp" id="o-notes" rows="2" placeholder="Quantity, size, anything else…"></textarea></div>'
    +'<div style="font-size:.67rem;color:var(--orange);background:rgba(255,149,0,.08);border:1px solid rgba(255,149,0,.2);border-radius:7px;padding:8px 10px;">📧 If no response within 48 hours of being contacted, your order will be automatically cancelled.</div>'
    +'<div class="merr" id="o-err"></div>'
    +'<div class="modal-row"><button class="mbtn ghost" id="o-cancel">Cancel</button><button class="mbtn" id="o-submit">📧 Place Order</button></div>',
    function(el) {
      el.querySelector('#o-cancel').onclick = closeModal;
      el.querySelector('#o-submit').onclick  = function() { doOrder(url); };
    });
}

async function doOrder(modelUrl) {
  var name  = document.getElementById('o-name')?.value.trim();
  var email = document.getElementById('o-email')?.value.trim();
  var phone = document.getElementById('o-phone')?.value.trim();
  var addr  = document.getElementById('o-addr')?.value.trim();
  var color = document.getElementById('o-color')?.value.trim();
  var notes = document.getElementById('o-notes')?.value.trim();
  var err   = document.getElementById('o-err');
  err.classList.remove('show');
  if (!name)  { err.textContent='Enter your name.';    err.classList.add('show'); return; }
  if (!email) { err.textContent='Enter your email.';   err.classList.add('show'); return; }
  if (!addr)  { err.textContent='Enter your address.'; err.classList.add('show'); return; }

  var btn = document.getElementById('o-submit');
  btn.textContent='Sending…'; btn.disabled=true;

  try {
    await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
      to_email:   'donutz.web.dev@gmail.com',
      from_name:  name,
      from_email: email,
      phone:      phone || 'Not provided',
      address:    addr,
      items:      'Model URL: ' + modelUrl,
      total:      'Quote needed',
      notes:      (color ? 'Color: ' + color + '\n' : '') + (notes || 'None'),
      order_date: new Date().toLocaleString()
    });
    closeModal();
    toast('✅ Order placed! We\'ll contact you soon.');
  } catch(e) {
    err.textContent='Send failed: '+(e.text||e.message||'unknown error');
    err.classList.add('show');
    btn.textContent='📧 Place Order'; btn.disabled=false;
  }
}

// ── CUSTOM ORDER ──────────────────────
function showCustomOrder() {
  modal('<div class="modal-title">✏️ Custom Print Request</div>'
    +'<div class="modal-sub">Want something specific? Describe it and we\'ll figure it out!</div>'
    +'<div><div class="inp-label">Your Name *</div><input class="inp" id="c-name" placeholder="Your name"></div>'
    +'<div><div class="inp-label">Email Address *</div><input class="inp" id="c-email" type="email" placeholder="your@email.com"></div>'
    +'<div><div class="inp-label">Phone (optional)</div><input class="inp" id="c-phone" placeholder="+1 (555) 000-0000"></div>'
    +'<div><div class="inp-label">Describe your item *</div><textarea class="inp" id="c-desc" rows="3" placeholder="What do you want? Size, color, purpose, any reference links…"></textarea></div>'
    +'<div><div class="inp-label">Special Notes</div><textarea class="inp" id="c-notes" rows="2" placeholder="Anything else we should know…"></textarea></div>'
    +'<div style="font-size:.67rem;color:var(--orange);background:rgba(255,149,0,.08);border:1px solid rgba(255,149,0,.2);border-radius:7px;padding:8px 10px;">📧 We\'ll get back to you with a quote. No response within 48 hours = request cancelled.</div>'
    +'<div class="merr" id="c-err"></div>'
    +'<div class="modal-row"><button class="mbtn ghost" id="c-cancel">Cancel</button><button class="mbtn orange" id="c-submit">📧 Send Request</button></div>',
    function(el) {
      el.querySelector('#c-cancel').onclick = closeModal;
      el.querySelector('#c-submit').onclick  = doCustom;
    });
}

async function doCustom() {
  var name  = document.getElementById('c-name')?.value.trim();
  var email = document.getElementById('c-email')?.value.trim();
  var phone = document.getElementById('c-phone')?.value.trim();
  var desc  = document.getElementById('c-desc')?.value.trim();
  var notes = document.getElementById('c-notes')?.value.trim();
  var err   = document.getElementById('c-err');
  err.classList.remove('show');
  if (!name)  { err.textContent='Enter your name.';       err.classList.add('show'); return; }
  if (!email) { err.textContent='Enter your email.';      err.classList.add('show'); return; }
  if (!desc)  { err.textContent='Describe your item.';    err.classList.add('show'); return; }

  var btn = document.getElementById('c-submit');
  btn.textContent='Sending…'; btn.disabled=true;

  try {
    await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
      to_email:   'donutz.web.dev@gmail.com',
      from_name:  name,
      from_email: email,
      phone:      phone || 'Not provided',
      address:    'N/A — Custom Request',
      items:      'CUSTOM REQUEST:\n' + desc,
      total:      'Quote needed',
      notes:      notes || 'None',
      order_date: new Date().toLocaleString()
    });
    closeModal();
    toast('✅ Request sent! We\'ll quote you soon.');
  } catch(e) {
    err.textContent='Send failed: '+(e.text||e.message||'unknown error');
    err.classList.add('show');
    btn.textContent='📧 Send Request'; btn.disabled=false;
  }
}

// ── UTILS ─────────────────────────────
function modal(html, wire) {
  closeModal();
  var bg=document.createElement('div'); bg.className='modal-bg'; bg.id='modal-bg';
  var m=document.createElement('div'); m.className='modal'; m.innerHTML=html;
  bg.appendChild(m); document.body.appendChild(bg);
  bg.onclick=function(e){ if(e.target===bg) closeModal(); };
  if(wire) wire(m);
}
function closeModal(){ document.getElementById('modal-bg')?.remove(); }
function h(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
var toastT;
function toast(msg){
  var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove('show'); },3500);
}
</script>
</body>
</html>
